AWSTemplateFormatVersion: '2010-09-09'
Description: Envigo ESG retained data, identity and network layer (eu-central-1)

Parameters:
  EnvironmentName:
    Type: String
    Default: demo
  EnableDemoEgress:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  # 'instance' = a t4g.nano NAT instance (~$8/month incl. its public IPv4);
  # 'gateway' = a managed NAT Gateway (~$42/month idle, highly available).
  # The demo only needs low-volume egress (OpenAI, SMTP, Cognito), so the
  # instance is the default.
  EgressMode:
    Type: String
    Default: instance
    AllowedValues: [instance, gateway]
  NatInstanceAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Conditions:
  DemoEgressEnabled: !Equals [!Ref EnableDemoEgress, 'true']
  UseNatGateway: !And [!Condition DemoEgressEnabled, !Equals [!Ref EgressMode, gateway]]
  UseNatInstance: !And [!Condition DemoEgressEnabled, !Equals [!Ref EgressMode, instance]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub 'envigo-${EnvironmentName}'}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.101.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub 'envigo-${EnvironmentName}-public-a'}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.1.0/24
      Tags: [{Key: Name, Value: !Sub 'envigo-${EnvironmentName}-private-a'}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.2.0/24
      Tags: [{Key: Name, Value: !Sub 'envigo-${EnvironmentName}-private-b'}]
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable}
  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable}

  NatEip:
    Type: AWS::EC2::EIP
    Condition: UseNatGateway
    DependsOn: InternetGatewayAttachment
    Properties: {Domain: vpc}
  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: UseNatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{Key: Name, Value: !Sub 'envigo-${EnvironmentName}-demo-only'}]

  NatInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseNatInstance
    Properties:
      GroupDescription: NAT instance - forwards outbound traffic from the private subnets
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: '-1', CidrIp: 10.42.0.0/16}
  NatInstanceV2:
    Type: AWS::EC2::Instance
    Condition: UseNatInstance
    DependsOn: PublicDefaultRoute
    Properties:
      ImageId: !Ref NatInstanceAmi
      InstanceType: t4g.nano
      # Standard credits: a runaway burst can never bill beyond the hourly rate.
      CreditSpecification: {CPUCredits: standard}
      SourceDestCheck: false
      MetadataOptions: {HttpTokens: required}
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref PublicSubnetA
          AssociatePublicIpAddress: true
          GroupSet: [!Ref NatInstanceSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub 'envigo-${EnvironmentName}-nat'}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          # 512 MB of RAM is too little for dnf's metadata load -- give it swap.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=1024
            chmod 600 /swapfile
            mkswap /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          swapon -a
          dnf install -y --setopt=install_weak_deps=False iptables-services
          echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/90-nat.conf
          sysctl --system
          systemctl enable --now iptables
          # The stock ruleset rejects forwarded packets -- clear it, then
          # masquerade everything leaving the public interface.
          IFACE=$(ip route show default | awk '{print $5; exit}')
          iptables -F FORWARD
          iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
          service iptables save

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: DemoEgressEnabled
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [UseNatGateway, !Ref NatGateway, !Ref 'AWS::NoValue']
      InstanceId: !If [UseNatInstance, !Ref NatInstanceV2, !Ref 'AWS::NoValue']

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Envigo Lambda egress
      VpcId: !Ref Vpc
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from Envigo Lambda
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub 'envigo/${EnvironmentName}/database'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"envigo_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Envigo private database subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub 'envigo-${EnvironmentName}'
      Engine: aurora-postgresql
      EngineVersion: '17.11'
      DatabaseName: envigo
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      EnableHttpEndpoint: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: 2
        SecondsUntilAutoPause: 300
  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  AttachmentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'envigo-${EnvironmentName}-backend'
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep five images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'envigo-${EnvironmentName}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 2
      Schema:
        - Name: user_id
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: {MinLength: '36', MaxLength: '36'}
        - Name: tenant_id
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: {MinLength: '36', MaxLength: '36'}
        - Name: roles
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints: {MinLength: '2', MaxLength: '256'}
      UserPoolTags:
        Application: Envigo
        Environment: !Ref EnvironmentName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: envigo-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

Outputs:
  VpcId: {Value: !Ref Vpc}
  PrivateSubnetA: {Value: !Ref PrivateSubnetA}
  PrivateSubnetB: {Value: !Ref PrivateSubnetB}
  LambdaSecurityGroupId: {Value: !Ref LambdaSecurityGroup}
  DatabaseEndpoint: {Value: !GetAtt DatabaseCluster.Endpoint.Address}
  DatabaseSecretArn: {Value: !Ref DatabaseSecret}
  DatabaseClusterArn: {Value: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${DatabaseCluster}'}
  AttachmentsBucketName: {Value: !Ref AttachmentsBucket}
  BackendRepositoryUri: {Value: !GetAtt BackendRepository.RepositoryUri}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  DemoEgressEnabled: {Value: !Ref EnableDemoEgress}
