AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for Envigo image publishing

Parameters:
  GitHubRepository:
    Type: String
    Default: SaiPraneeth-GenAI/ar-esg
  RepositoryName:
    Type: String
    Default: envigo-demo-backend

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  GitHubBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: envigo-github-ecr-push
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProvider}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:*'
                  - 'repo:saipraneeth-genai/ar-esg:*'
      Policies:
        - PolicyName: PushBackendImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'

Outputs:
  RoleArn: {Value: !GetAtt GitHubBuildRole.Arn}
