[build]
  command = "npm run build:netlify"
  publish = "dist/frontend/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html must never be cached -- it references content-hashed bundle
# filenames, so a stale cached copy after a deploy can point at chunks that
# no longer exist. Hashed JS/CSS assets are immutable per-hash, so those can
# (and should) be cached aggressively.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
