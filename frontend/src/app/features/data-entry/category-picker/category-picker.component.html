@for (section of sections(); track section.id) {
  <section class="picker-section" [class.value-chain]="section.id === 'scope3'">
    <header class="section-head">
      <div>
        <h2 class="section-title">
          {{ section.title }}
          <span class="section-count">{{ section.categories.length }}</span>
        </h2>
        <p class="section-subtitle">{{ section.subtitle }}</p>
      </div>
    </header>

    <div class="picker-grid">
      @for (category of section.categories; track category.id) {
        <button type="button" class="picker-card" (click)="pick.emit(category)">
          <div class="picker-icon">
            @switch (iconFor(category.name)) {
              @case ('droplet') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2.5s7 7.4 7 12a7 7 0 0 1-14 0c0-4.6 7-12 7-12Z" />
                </svg>
              }
              @case ('trash') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18" />
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                </svg>
              }
              @case ('wind') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 8h11a3 3 0 1 0-3-3" />
                  <path d="M3 16h15a3 3 0 1 1-3 3" />
                </svg>
              }
              @case ('flask') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 2v6L4 19a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L15 8V2" />
                  <path d="M9 2h6" />
                  <path d="M6.5 15h11" />
                </svg>
              }
              @case ('cloud') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10Z" />
                </svg>
              }
              @case ('chart') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 3v18h18" />
                  <path d="m7 15 4-4 3 3 5-6" />
                </svg>
              }
              @case ('shield') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
                  <path d="m9 12 2 2 4-4" />
                </svg>
              }
              @case ('battery') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="7" width="17" height="10" rx="2" />
                  <path d="M22 11v2" />
                  <path d="M6 10v4M10 10v4" />
                </svg>
              }
              @case ('box') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z" />
                  <path d="m3 8 9 5 9-5" />
                  <path d="M12 13v8" />
                </svg>
              }
              @case ('factory') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 20V9l6 4V9l6 4V4h4l2 16Z" />
                  <path d="M2 20h20" />
                </svg>
              }
              @case ('bolt') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" />
                </svg>
              }
              @case ('truck') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 5h13v11H1z" />
                  <path d="M14 9h4l4 4v3h-8" />
                  <circle cx="5.5" cy="18" r="2" />
                  <circle cx="17.5" cy="18" r="2" />
                </svg>
              }
              @case ('recycle') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7L5 13" />
                  <path d="M11 19h8.2a1.8 1.8 0 0 0 1.6-2.7L19.5 14" />
                  <path d="m14 16-3 3 3 3" />
                  <path d="M8.3 6.3 9.6 4a1.8 1.8 0 0 1 3.1 0l3.3 5.6" />
                  <path d="m7 9 1.3-2.7L5.4 5" />
                  <path d="m17 13-1-3.4-3.3.8" />
                </svg>
              }
              @case ('plane') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2Z" />
                </svg>
              }
              @case ('users') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.9" />
                  <path d="M16 3.1a4 4 0 0 1 0 7.8" />
                </svg>
              }
              @default {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                  <path d="M14 2v6h6" />
                </svg>
              }
            }
          </div>

          <div class="picker-body">
            <div class="picker-top">
              <span class="picker-name">{{ category.name }}</span>
              @if (category.is_provisional) {
                <span class="provisional-badge">Provisional</span>
              }
            </div>
            <span class="picker-count">
              {{ category.data_points.length }} field{{ category.data_points.length === 1 ? '' : 's' }}
              @if (scope3Badge(category)) {
                <span class="scope3-badge" [title]="category.scope3_category ?? ''">{{ scope3Badge(category) }}</span>
              } @else if (category.ghg_scope) {
                <span class="ghg-badge">GHG source</span>
              }
            </span>
          </div>

          <svg class="picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      }
    </div>
  </section>
}
