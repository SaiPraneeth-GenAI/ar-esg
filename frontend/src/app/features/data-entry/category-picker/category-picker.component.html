<div class="picker-grid">
  @for (category of categories; track category.id) {
    <button type="button" class="picker-card" (click)="pick.emit(category)">
      <div class="picker-top">
        <span class="picker-name">{{ category.name }}</span>
        @if (category.is_provisional) {
          <span class="provisional-badge">Provisional</span>
        }
      </div>
      <span class="picker-count">{{ category.data_points.length }} field{{ category.data_points.length === 1 ? '' : 's' }}</span>
    </button>
  }
</div>
