<div class="page">
  <header class="dash-header">
    <div class="header-top">
      <div class="title-block">
        <h1>Amara Raja ESG Dashboard</h1>
        <p class="subtitle">Showing {{ formatPeriodLabel() }}</p>
      </div>

      <div class="header-controls">
        <div class="mode-toggle" role="group" aria-label="Period mode">
          <button type="button" class="mode-btn" [class.active]="periodMode() === 'month'" (click)="periodMode.set('month')">Monthly</button>
          <button type="button" class="mode-btn" [class.active]="periodMode() === 'quarter'" (click)="periodMode.set('quarter')">Quarterly</button>
          <button type="button" class="mode-btn" [class.active]="periodMode() === 'ytd'" (click)="periodMode.set('ytd')">YTD</button>
        </div>

        <label class="control">
          <span class="control-label">Period</span>
          <input
            type="month"
            [ngModel]="period()"
            (ngModelChange)="period.set($event)"
          />
        </label>

        <label class="control">
          <span class="control-label">Site</span>
          <select [ngModel]="locationId()" (ngModelChange)="locationId.set($event); onFiltersChange()">
            <option value="">Company-wide</option>
            @for (loc of locations(); track loc.id) {
              <option [value]="loc.id">{{ loc.name }}</option>
            }
          </select>
        </label>

        <a class="status-badge" [class.has-issues]="unresolvedCount() > 0" routerLink="/admin/data-entry">
          <span class="status-dot"></span>
          {{ unresolvedCount() }} unresolved {{ unresolvedCount() === 1 ? 'entry' : 'entries' }}
        </a>
      </div>
    </div>

    <nav class="tabs">
      <button type="button" class="tab" [class.active]="activeTab() === 'absolute'" (click)="setTab('absolute')">Absolute Metrics</button>
      <button type="button" class="tab" [class.active]="activeTab() === 'production'" (click)="setTab('production')">Intensity by Production</button>
      <button type="button" class="tab" [class.active]="activeTab() === 'revenue'" (click)="setTab('revenue')">Intensity by Revenue</button>
      <button type="button" class="tab" [class.active]="activeTab() === 'safety'" (click)="setTab('safety')">Safety &amp; Trends</button>
    </nav>
  </header>

  <div class="tab-content">
    @switch (activeTab()) {
      @case ('absolute') {
        <app-absolute-metrics-view [period]="period()" [locationId]="effectiveLocationId()" [periodMode]="periodMode()"></app-absolute-metrics-view>
      }
      @case ('production') {
        <app-intensity-view mode="production" [period]="period()" [locationId]="effectiveLocationId()" [periodMode]="periodMode()"></app-intensity-view>
      }
      @case ('revenue') {
        <app-intensity-view mode="revenue" [period]="period()" [locationId]="effectiveLocationId()" [periodMode]="periodMode()"></app-intensity-view>
      }
      @case ('safety') {
        <app-safety-view [period]="period()" [locationId]="effectiveLocationId()" [periodMode]="periodMode()"></app-safety-view>
      }
    }
  </div>
</div>
