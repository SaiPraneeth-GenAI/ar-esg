<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/logo-icon.png" alt="Amara Raja" />
      <span>Amara Raja</span>
    </div>

    <nav class="sidebar-nav">
      <button type="button" class="nav-item" [class.active]="isDashboardRoute()" (click)="goToDashboard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5" />
          <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" />
        </svg>
        <span>Home</span>
      </button>

      @if (canAccessDataEntry()) {
        <button type="button" class="nav-item" [class.active]="isDataEntryRoute()" (click)="goToDataEntry()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
          <span>Data Entry</span>
        </button>
      }

      @if (canAccessSettings()) {
        <button type="button" class="nav-item" [class.active]="isSettingsRoute()" (click)="openSettings()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
            />
          </svg>
          <span>Settings</span>
          <svg class="chevron" [class.open]="settingsOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        @if (settingsOpen()) {
          <div class="nav-subitems">
            <a routerLink="/admin/settings/users" routerLinkActive="active" class="nav-subitem">User Management</a>
            <a routerLink="/admin/settings/roles" routerLinkActive="active" class="nav-subitem">User Roles</a>
            <a routerLink="/admin/settings/plants" routerLinkActive="active" class="nav-subitem">Assigned Plants</a>
          </div>
        }
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <img class="topbar-logo" src="/logo-lockup.png" alt="Amara Raja" />
      <div class="topbar-user">
        <span class="user-email">{{ userEmail() }}</span>
        <button type="button" class="logout-btn" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Log out
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
