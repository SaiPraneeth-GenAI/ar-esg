<div class="bell-wrap" (click)="$event.stopPropagation()">
  <button type="button" class="bell-btn" (click)="toggle($event)" [attr.aria-label]="hasUnread() ? unreadCount() + ' unread notifications' : 'Notifications'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (hasUnread()) {
      <span class="bell-badge">{{ badgeLabel() }}</span>
    }
  </button>

  @if (open()) {
    <div class="bell-panel">
      <div class="bell-panel-header">
        <span>Notifications</span>
        @if (hasUnread()) {
          <button type="button" class="mark-all-btn" (click)="markAllRead($event)">Mark all read</button>
        }
      </div>
      @if (notifications().length === 0) {
        <div class="bell-empty">Nothing yet.</div>
      } @else {
        <div class="bell-list">
          @for (n of notifications(); track n.id) {
            <button type="button" class="bell-item" [class.unread]="!n.read_at" (click)="selectNotification(n)">
              @if (!n.read_at) {
                <span class="unread-dot" aria-hidden="true"></span>
              }
              <span class="bell-item-body">
                <span class="bell-item-title">{{ n.title }}</span>
                @if (n.body) {
                  <span class="bell-item-text">{{ n.body }}</span>
                }
                <span class="bell-item-time">{{ relativeTime(n.created_at) }}</span>
              </span>
            </button>
          }
        </div>
      }
    </div>
  }
</div>
