name: Deploy backend to Azure Container Apps

# Azure is the system of record -- auto-deploys on every push that touches
# the backend, same as Render used to. workflow_dispatch stays available
# for a manual re-run (e.g. redeploying without a code change).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/azure-backend.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ar-esg-backend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        working-directory: backend
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${IMAGE_NAME}:${{ github.sha }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE_TAG" \
            -t "ghcr.io/${OWNER}/${IMAGE_NAME}:latest" .
          docker push "$IMAGE_TAG"
          docker push "ghcr.io/${OWNER}/${IMAGE_NAME}:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
