name: Deploy backend to Azure Container Apps

# Azure is the system of record -- auto-deploys on every push that touches
# the backend, same as Render used to. workflow_dispatch stays available
# for a manual re-run (e.g. redeploying without a code change).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/azure-backend.yml"
  workflow_dispatch: {}

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
  IMAGE_NAME: envigo-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $(echo "$ACR_LOGIN_SERVER" | cut -d'.' -f1)

      - name: Build and push image
        working-directory: backend
        run: |
          IMAGE_TAG="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -t "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest" .
          docker push "$IMAGE_TAG"
          docker push "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG"
